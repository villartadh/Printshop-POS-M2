name: Native Android foundation
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [develop]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exact centavo tests
        run: |
          mkdir -p /tmp/quote-classes
          javac -d /tmp/quote-classes android-native/app/src/main/java/ph/printshop/pos/QuoteMath.java android-native/tests/QuoteMathTest.java android-native/app/src/main/java/ph/printshop/pos/CatalogEntry.java android-native/tests/CatalogEntryTest.java android-native/app/src/main/java/ph/printshop/pos/StockMath.java android-native/tests/StockMathTest.java android-native/app/src/main/java/ph/printshop/pos/MaterialCost.java android-native/tests/MaterialCostTest.java android-native/app/src/main/java/ph/printshop/pos/PricingMath.java android-native/tests/PricingMathTest.java android-native/app/src/main/java/ph/printshop/pos/PricingProfile.java android-native/tests/PricingProfileTest.java android-native/app/src/main/java/ph/printshop/pos/CheckoutPlan.java android-native/app/src/main/java/ph/printshop/pos/CheckoutPreview.java android-native/tests/CheckoutPlanTest.java android-native/app/src/main/java/ph/printshop/pos/CashierSecurity.java android-native/app/src/main/java/ph/printshop/pos/ShiftMath.java android-native/tests/CashierSecurityTest.java android-native/app/src/main/java/ph/printshop/pos/TrainingForms.java android-native/tests/TrainingFormsTest.java android-native/tests/DrawerMathTest.java android-native/app/src/main/java/ph/printshop/pos/ReportMath.java android-native/tests/ReportMathTest.java android-native/app/src/main/java/ph/printshop/pos/RecurringMath.java android-native/tests/RecurringMathTest.java android-native/app/src/main/java/ph/printshop/pos/ReceivableMath.java android-native/tests/ReceivableMathTest.java android-native/app/src/main/java/ph/printshop/pos/CreditCheckoutPlan.java android-native/tests/CreditCheckoutPlanTest.java android-native/app/src/main/java/ph/printshop/pos/SavedQuotation.java android-native/tests/SavedQuotationTest.java android-native/app/src/main/java/ph/printshop/pos/ReceiptDocument.java android-native/tests/ReceiptDocumentTest.java android-native/app/src/main/java/ph/printshop/pos/ProductionWorkflow.java android-native/tests/ProductionWorkflowTest.java android-native/app/src/main/java/ph/printshop/pos/BackupEnvelope.java android-native/tests/BackupEnvelopeTest.java android-native/app/src/main/java/ph/printshop/pos/BackupFileTransfer.java android-native/tests/BackupFileTransferTest.java
          java -cp /tmp/quote-classes ph.printshop.pos.QuoteMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.CatalogEntryTest
          java -cp /tmp/quote-classes ph.printshop.pos.StockMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.MaterialCostTest
          java -cp /tmp/quote-classes ph.printshop.pos.PricingMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.PricingProfileTest
          java -cp /tmp/quote-classes ph.printshop.pos.CheckoutPlanTest
          java -cp /tmp/quote-classes ph.printshop.pos.CashierSecurityTest
          java -cp /tmp/quote-classes ph.printshop.pos.TrainingFormsTest
          java -cp /tmp/quote-classes ph.printshop.pos.DrawerMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.ReportMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.RecurringMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.ReceivableMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.CreditCheckoutPlanTest
          java -cp /tmp/quote-classes ph.printshop.pos.SavedQuotationTest
          java -cp /tmp/quote-classes ph.printshop.pos.ReceiptDocumentTest
          java -cp /tmp/quote-classes ph.printshop.pos.ProductionWorkflowTest
          java -cp /tmp/quote-classes ph.printshop.pos.BackupEnvelopeTest
          java -cp /tmp/quote-classes ph.printshop.pos.BackupFileTransferTest
      - name: Stock request SQLite schema checks
        run: |
          python3 android-native/tests/stock_request_schema_test.py
          python3 android-native/tests/checkout_journal_schema_test.py
          python3 android-native/tests/cashier_journal_schema_test.py
          python3 android-native/tests/credential_journal_schema_test.py
          python3 android-native/tests/staff_journal_schema_test.py
          python3 android-native/tests/admin_journal_schema_test.py
          python3 android-native/tests/catalog_page_query_test.py
          python3 android-native/tests/drawer_journal_schema_test.py
          python3 android-native/tests/refund_journal_schema_test.py
          python3 android-native/tests/report_journal_schema_test.py
          python3 android-native/tests/recurring_journal_schema_test.py
          python3 android-native/tests/customer_journal_schema_test.py
          python3 android-native/tests/customer_checkout_schema_test.py
          python3 android-native/tests/receivable_journal_schema_test.py
          python3 android-native/tests/credit_cash_journal_schema_test.py
          python3 android-native/tests/credit_checkout_journal_schema_test.py
          python3 android-native/tests/quotation_journal_schema_test.py
          python3 android-native/tests/production_journal_schema_test.py
      - name: Provision Android SDK
        uses: android-actions/setup-android@v4.0.3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Verify Android SDK provisioning
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
      - name: Build and lint native preview
        run: gradle -p android-native --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Preserve full lint diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-lint-diagnostics
          path: |
            android-native/app/build/reports/lint-results-debug.html
            android-native/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload APK preview and lint
        uses: actions/upload-artifact@v4
        with:
          name: native-android-foundation-preview-not-for-sales
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
      - name: Enable hardware acceleration on disposable CI runner
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Installed native Activity smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash -euo pipefail -c 'mkdir -p android-evidence; trap "adb logcat -d -b crash > android-evidence/native-crash.txt || true" EXIT; adb logcat -c; adb install android-native/app/build/outputs/apk/debug/app-debug.apk; adb install android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell am instrument -w -r ph.printshop.pos.preview.test/ph.printshop.pos.NativeQuoteSmoke | tr -d "\\r" | tee android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTE_SMOKE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CATALOG_STORE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CATALOG_SCREEN_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_STOCK_LEDGER_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_STOCK_SCREEN_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_STOCK_RECOVERY_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CHECKOUT_PLAN_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_DURABLE_CHECKOUT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CASHIER_SHIFT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CASHIER_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CREDENTIAL_LIFECYCLE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_ADMIN_AUTH_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_STAFF_DISABLE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_ADMIN_AUDIT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_OWNER_CATALOG_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_DRAWER_LEDGER_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_REFUND_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_SALES_REPORT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_REPORT_CHART_HISTORY_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_RECURRING_EXPENSE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_RECURRING_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CUSTOMER_DIRECTORY_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CUSTOMER_CHECKOUT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CREDIT_COLLECTION_API_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CREDIT_REPORT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CREDIT_CHECKOUT_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CREDIT_COLLECTION_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_MATERIAL_COST_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_RECIPE_SCREEN_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_PRICING_STORE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_PRICING_SETTINGS_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_ADVANCED_QUOTE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_SAVED_QUOTATION_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTATION_CASH_CONVERSION_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTATION_CREDIT_CONVERSION_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTATION_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_PRODUCTION_JOURNAL_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_PRODUCTION_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_PRODUCTION_POLICY_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTE_PRODUCTION_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTE_PRODUCTION_UI_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_RECEIPT_PDF_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_RECEIPT_REPRINT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_BACKUP_SNAPSHOT_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_BACKUP_IMPORT_UI_PASS" android-evidence/native-smoke.txt; grep -Fx "INSTRUMENTATION_CODE: -1" android-evidence/native-smoke.txt; if grep -F "NATIVE_QUOTE_SMOKE_FAIL" android-evidence/native-smoke.txt; then exit 1; fi'
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-smoke-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 14
