name: Native Android foundation
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exact centavo tests
        run: |
          mkdir -p /tmp/quote-classes
          javac -d /tmp/quote-classes android-native/app/src/main/java/ph/printshop/pos/QuoteMath.java android-native/tests/QuoteMathTest.java
          java -cp /tmp/quote-classes ph.printshop.pos.QuoteMathTest
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and lint native preview
        run: gradle -p android-native --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload APK preview and lint
        uses: actions/upload-artifact@v4
        with:
          name: native-android-foundation-preview-not-for-sales
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
