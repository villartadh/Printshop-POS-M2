name: Native Android foundation
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [develop]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exact centavo tests
        run: |
          mkdir -p /tmp/quote-classes
          javac -d /tmp/quote-classes android-native/app/src/main/java/ph/printshop/pos/QuoteMath.java android-native/tests/QuoteMathTest.java android-native/app/src/main/java/ph/printshop/pos/CatalogEntry.java android-native/tests/CatalogEntryTest.java
          java -cp /tmp/quote-classes ph.printshop.pos.QuoteMathTest
          java -cp /tmp/quote-classes ph.printshop.pos.CatalogEntryTest
      - name: Provision Android SDK
        uses: android-actions/setup-android@v4.0.3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Verify Android SDK provisioning
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
      - name: Build and lint native preview
        run: gradle -p android-native --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Upload APK preview and lint
        uses: actions/upload-artifact@v4
        with:
          name: native-android-foundation-preview-not-for-sales
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
      - name: Enable hardware acceleration on disposable CI runner
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Installed native Activity smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash -euo pipefail -c 'mkdir -p android-evidence; adb install android-native/app/build/outputs/apk/debug/app-debug.apk; adb install android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell am instrument -w -r ph.printshop.pos.preview.test/ph.printshop.pos.NativeQuoteSmoke | tr -d "\\r" | tee android-evidence/native-smoke.txt; grep -F "NATIVE_QUOTE_SMOKE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CATALOG_STORE_PASS" android-evidence/native-smoke.txt; grep -F "NATIVE_CATALOG_SCREEN_PASS" android-evidence/native-smoke.txt; grep -Fx "INSTRUMENTATION_CODE: -1" android-evidence/native-smoke.txt; if grep -F "NATIVE_QUOTE_SMOKE_FAIL" android-evidence/native-smoke.txt; then exit 1; fi'
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-smoke-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 14
