name: Development bridge pilot
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tools/development-bridge/**'
      - '.github/workflows/development-bridge.yml'
permissions:
  contents: read
  actions: read
jobs:
  checkpoint:
    if: github.repository == 'villartadh/Printshop-POS-M2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MCP SDK
        run: python3 -m pip install --disable-pip-version-check -r tools/development-bridge/requirements-mcp.txt
      - name: Test checkpoint contract
        run: python3 -m unittest discover -s tools/development-bridge -p 'test_*.py' -v
      - name: Collect exact PR head gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/development-bridge/ci_checkpoint.py --sha "$TARGET_SHA" --wait-seconds 1800 > "$RUNNER_TEMP/ci-checkpoint.json"
          python3 tools/development-bridge/checkpoint_validation.py --sha "$TARGET_SHA" --file "$RUNNER_TEMP/ci-checkpoint.json"
          cat "$RUNNER_TEMP/ci-checkpoint.json"
      - uses: actions/upload-artifact@v4
        with:
          name: development-ci-checkpoint
          path: ${{ runner.temp }}/ci-checkpoint.json
          retention-days: 14
