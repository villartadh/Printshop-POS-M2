name: Software acceptance
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: software-acceptance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run acceptance
      - name: Checkout immutable v0.9.5 baseline
        uses: actions/checkout@v4
        with:
          ref: 255518ed388bcee3d63ee211e17c199ba984547e
          path: .baseline-v095
          persist-credentials: false
      - run: npm ci --prefix .baseline-v095
      - name: Verify actual baseline database upgrade and restoration
        run: node scripts/upgrade-acceptance.mjs .baseline-v095
      - name: Remove baseline checkout before packaging
        run: rm -rf .baseline-v095
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run acceptance:browser
      - if: runner.os == 'Linux'
        run: npm run acceptance:https
      - name: Stage and verify Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeDir = Split-Path (Get-Command node.exe).Source
          node scripts/stage-windows.mjs $nodeDir windows-stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location windows-stage
          try {
            & .\runtime\node.exe --input-type=commonjs -e "const db = new (require('better-sqlite3'))(':memory:'); if(db.prepare('SELECT 1 AS ok').get().ok !== 1) process.exit(1); db.close();"
            if ($LASTEXITCODE -ne 0) { throw 'Bundled SQLite test failed' }
            & .\runtime\node.exe --input-type=module -e "import fs from 'node:fs'; import {verifyRelease} from './scripts/install.mjs'; verifyRelease(process.cwd(), JSON.parse(fs.readFileSync('RELEASE-MANIFEST.json')));"
            if ($LASTEXITCODE -ne 0) { throw 'Release manifest verification failed' }
          } finally { Pop-Location }
          node scripts/windows/package-smoke.mjs windows-stage
          if ($LASTEXITCODE -ne 0) { throw 'Isolated packaged application smoke test failed' }
          Compress-Archive -Path windows-stage\* -DestinationPath Printshop-POS-Windows-x64.zip
          $hash = (Get-FileHash Printshop-POS-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii SHA256SUMS.txt "$hash  Printshop-POS-Windows-x64.zip"
      - name: Upload Windows candidate
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate
          path: |
            Printshop-POS-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-evidence-${{ runner.os }}
          path: .ldc/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
